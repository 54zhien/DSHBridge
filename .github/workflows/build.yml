name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test (protocol conformance)
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+( Pro)?( Max)?" | head -1)
          echo "simulator: $DEVICE"
          xcodebuild test \
            -project DSHBridge.xcodeproj \
            -scheme DSHBridge \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO
      - name: Build (device, unsigned)
        run: |
          xcodebuild build \
            -project DSHBridge.xcodeproj \
            -scheme DSHBridge \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/DSHBridge.app
          test -x "$APP/DSHBridge" || { echo "binary missing in $APP"; exit 1; }
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry DSHBridge-unsigned.ipa Payload
          ls -lh DSHBridge-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: DSHBridge-unsigned
          path: out/DSHBridge-unsigned.ipa
