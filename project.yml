name: DSHBridge
options:
  bundleIdPrefix: dev.zhien
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  DSHBridge:
    type: application
    platform: iOS
    sources:
      - path: Sources/DSHBridgeApp
      - path: Sources/DSHBridgeProtocol
      - path: Sources/DSHBridgeUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zhien.dshbridge
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: DSH Bridge
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: NO
  DSHBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/DSHBridgeTests
    dependencies:
      - target: DSHBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zhien.dshbridge.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
